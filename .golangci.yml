version: "2"

linters:
  default: none
  enable:
    - misspell
    - staticcheck
    - govet
    - revive
    - ineffassign
    - unused
    - prealloc
    - unconvert
  settings:
    misspell:
      locale: US
    staticcheck:
      checks:
        - "all"
        - "-SA1019"
        - "-ST1000"  # package comments
        - "-ST1019"  # duplicate imports
        - "-QF1001"  # De Morgan's law suggestions
        - "-QF1002"  # tagged switch suggestions
        - "-QF1008"  # embedded field selector suggestions
        - "-QF1012"  # fmt.Fprint suggestions
  exclusions:
    rules:
      - text: "var-naming: don't use ALL_CAPS in Go names; use CamelCase"
        linters: [revive]
      - text: "package-comments: should have a package comment"
        linters: [revive]
      - text: "exitAfterDefer:"
        linters: [revive]
      - linters: [prealloc]
        path: "_test\\.go"

formatters:
  enable:
    - goimports
    - gofumpt
