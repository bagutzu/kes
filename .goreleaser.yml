# NOTE: The primary GoReleaser config used by CI is at .github/goreleaser.yml
# This file is kept for local snapshot builds: goreleaser release --snapshot --clean

version: 2
project_name: kes

builds:
  -
    main: ./cmd/kes
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ignore:
      - goos: windows
        goarch: arm64
      - goos: darwin
        goarch: amd64
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
      - -buildvcs=true
    ldflags:
      - "-s -w"

archives:
  -
    name_template: "{{ .ProjectName }}-{{ .Os }}-{{ .Arch }}"
    format: binary

snapshot:
  version_template: '{{ replace .CommitDate ":" "-" }}'

changelog:
  sort: asc
