version: 2

env:
  - CGO_ENABLED=0

builds:
  - id: kes
    main: ./cmd/kes
    binary: kes
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ignore:
      - goos: windows
        goarch: arm64
      - goos: darwin
        goarch: amd64
    flags:
      - -trimpath
      - -buildvcs=true
    ldflags:
      - "-s -w"

archives:
  - id: kes
    ids:
      - kes
    name_template: "kes-{{ .Os }}-{{ .Arch }}"
    format: binary

nfpms:
  - vendor: bagutzu
    homepage: https://github.com/bagutzu/kes
    maintainer: bagutzu <https://github.com/bagutzu>
    description: KES is a stateless and distributed key-management system for high-performance applications (community fork)
    license: GNU Affero General Public License v3.0
    formats:
      - deb
      - rpm

dockers:
  - id: kes-amd64
    ids:
      - kes
    goos: linux
    goarch: amd64
    dockerfile: Dockerfile
    use: buildx
    image_templates:
      - "bagutzu/kes:{{ .Tag }}-amd64"
      - "bagutzu/kes:latest-amd64"
    build_flag_templates:
      - "--platform=linux/amd64"
      - "--build-arg=TAG={{ .Tag }}"
      - "--label=org.opencontainers.image.version={{ .Tag }}"
      - "--label=org.opencontainers.image.created={{ .Date }}"
      - "--label=org.opencontainers.image.revision={{ .FullCommit }}"
    extra_files:
      - LICENSE
      - CREDITS

  - id: kes-arm64
    ids:
      - kes
    goos: linux
    goarch: arm64
    dockerfile: Dockerfile
    use: buildx
    image_templates:
      - "bagutzu/kes:{{ .Tag }}-arm64"
      - "bagutzu/kes:latest-arm64"
    build_flag_templates:
      - "--platform=linux/arm64"
      - "--build-arg=TAG={{ .Tag }}"
      - "--label=org.opencontainers.image.version={{ .Tag }}"
      - "--label=org.opencontainers.image.created={{ .Date }}"
      - "--label=org.opencontainers.image.revision={{ .FullCommit }}"
    extra_files:
      - LICENSE
      - CREDITS

docker_manifests:
  - name_template: "bagutzu/kes:{{ .Tag }}"
    image_templates:
      - "bagutzu/kes:{{ .Tag }}-amd64"
      - "bagutzu/kes:{{ .Tag }}-arm64"
  - name_template: "bagutzu/kes:latest"
    image_templates:
      - "bagutzu/kes:latest-amd64"
      - "bagutzu/kes:latest-arm64"

checksum:
  name_template: "kes_{{ .Tag }}_checksums.txt"
  algorithm: sha256

release:
  github:
    owner: bagutzu
    name: kes
  draft: false
  prerelease: false
  mode: replace
  replace_existing_artifacts: true
  name_template: "{{ .Tag }}"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "Merge pull request"
      - "Merge branch"

announce:
  skip: true
