name: Go

on:
  pull_request:
    branches:
    - master
  push:
    branches:
    - master

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version-file: go.mod
      id: go
    - name: Check out code
      uses: actions/checkout@v4
    - name: Build and Lint
      run: |
         go build ./...
         go vet ./...
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: "Set up Go"
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
        id: go
      - name: Check out code
        uses: actions/checkout@v4
      - name: Lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: v2.14.0
          args: --config ./.golangci.yml --timeout=5m
  test:
    name: Test ${{ matrix.os }}
    needs: Lint
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version-file: go.mod
      id: go
    - name: Check out code
      uses: actions/checkout@v4
    - name: Test
      env:
        GO111MODULE: on
      run: |
         go test ./...
  
  vulncheck:
    name: Vulncheck
    runs-on: ubuntu-latest
    steps:
    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version-file: go.mod
    - name: Check out code into the Go module directory
      uses: actions/checkout@v4
    - name: Get govulncheck
      run: go install golang.org/x/vuln/cmd/govulncheck@latest
      shell: bash
    - name: Run govulncheck
      run: govulncheck ./...
      shell: bash

  kms-compat:
    name: KMS compat ${{ matrix.keystore }} / ${{ matrix.silo }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        keystore: [openbao/openbao:2.6, openbao/openbao:2.7, hashicorp/vault:2.1]
        silo: [RELEASE.2026-09-16T00-00-00Z]
        include:
          - keystore: openbao/openbao:2.7
            silo: RELEASE.2026-09-03T13-18-01Z
    steps:
    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version-file: go.mod
    - name: Check out code
      uses: actions/checkout@v4
    - name: Build the last upstream release
      run: GOBIN=$RUNNER_TEMP go install github.com/minio/kes/cmd/kes@2025-03-12T09-35-18Z
    - name: Upgrade from upstream, then read and write through this tree
      env:
        VAULT_IMAGE: ${{ matrix.keystore }}
        SILO_IMAGE: pgsty/silo:${{ matrix.silo }}
        KES_BASELINE: ${{ runner.temp }}/kes
      run: ./testing/kms-compat.sh
