name: Test Release

on:
  pull_request:
    branches:
      - master
    paths:
      - ".github/goreleaser.yml"
      - "Dockerfile"
      - "cmd/**"
      - "go.mod"
      - "go.sum"
  push:
    branches:
      - master
    paths:
      - ".github/goreleaser.yml"
      - "Dockerfile"
      - "cmd/**"
      - "go.mod"
      - "go.sum"

permissions:
  contents: read

jobs:
  test-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Test GoReleaser (snapshot)
        uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          args: release --skip=publish,sign --clean --snapshot --config .github/goreleaser.yml
